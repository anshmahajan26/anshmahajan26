<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#1a1024"/>
    </linearGradient>
    <linearGradient id="cpBar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>
  <rect width="420" height="160" rx="16" fill="url(#cpBg)" stroke="#7B2FFF" stroke-opacity="0.4"/>

  <!-- forecast bars -->
  <g transform="translate(30,20)">
    <rect x="0"  y="70" width="18" height="40" rx="3" fill="url(#cpBar)" opacity="0.85">
      <animate attributeName="height" values="40;70;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="70;40;70" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="55" width="18" height="55" rx="3" fill="url(#cpBar)" opacity="0.85">
      <animate attributeName="height" values="55;90;55" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="55;20;55" dur="3s" begin="0.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="35" width="18" height="75" rx="3" fill="url(#cpBar)" opacity="0.85">
      <animate attributeName="height" values="75;50;75" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="35;60;35" dur="3s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="78" y="15" width="18" height="95" rx="3" fill="url(#cpBar)">
      <animate attributeName="height" values="95;65;95" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;45;15" dur="3s" begin="0.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- mixer truck silhouette -->
  <g transform="translate(190,55)" fill="none" stroke="#39FF14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="70" cy="6" r="26" fill="#0d0d14" stroke="#FF00E5" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 70 6" to="360 70 6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,40 h55 l15,-15 h20 v15 h10 v25 h-100 z"/>
    <circle cx="20" cy="65" r="10"/>
    <circle cx="85" cy="65" r="10"/>
  </g>

  <text x="30" y="145" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="#f0f0f5">CementPro — Demand Forecasting</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="160">
  <defs>
    <linearGradient id="hhBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101018"/>
      <stop offset="100%" stop-color="#141428"/>
    </linearGradient>
    <linearGradient id="hhRoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF00E5"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
  </defs>
  <rect width="420" height="160" rx="16" fill="url(#hhBg)" stroke="#00F0FF" stroke-opacity="0.4"/>

  <!-- glowing house -->
  <g transform="translate(50,25)">
    <polygon points="60,0 0,45 120,45" fill="url(#hhRoof)">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.6s" repeatCount="indefinite"/>
    </polygon>
    <rect x="10" y="45" width="100" height="65" fill="#0d0d14" stroke="#00F0FF" stroke-width="2"/>
    <rect x="50" y="75" width="20" height="35" fill="#00F0FF" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="20" y="60" width="15" height="15" fill="#39FF14" opacity="0.6"/>
    <rect x="85" y="60" width="15" height="15" fill="#39FF14" opacity="0.6"/>
  </g>

  <!-- orbiting booking dots -->
  <g transform="translate(280,80)">
    <circle r="45" fill="none" stroke="#7B2FFF" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <circle cx="45" cy="0" r="5" fill="#FF00E5">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-45" cy="0" r="5" fill="#00F0FF">
      <animateTransform attributeName="transform" type="rotate" from="180 0 0" to="540 0 0" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="30" y="145" font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="700" fill="#f0f0f5">HostHive — Rental Property Platform</text>
</svg>